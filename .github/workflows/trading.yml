name: BANKNIFTY TimesFM Bot

on:
  schedule:
    # 09:01, 09:06, ... 09:21, 09:26 ... IST after UTC conversion.
    # src.main gates execution to minute % 5 == 1 and market hours.
    - cron: '1-59/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m src.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
