name: BANKNIFTY TimesFM Bot
on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
concurrency:
  group: banknifty-signal
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist journal
        run: |
          if [ ! -f data/trade_journal.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/trade_journal.json
          git diff --cached --quiet || (git commit -m "journal: persist signal state" && git push)
